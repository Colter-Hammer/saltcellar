# The pinned Rust toolchain (rust-toolchain.toml), a build cache, and the cargo tools a job asks for.
# Tool versions are kept in step with CONTRIBUTING.md. Checksums are from each release.

name: Rust
description: Install the Rust toolchain and cargo tools

inputs:
  tools:
    description: "Space-separated: deny nextest llvm-cov sqlx"
    default: ""

runs:
  using: composite
  steps:
    - name: Install the toolchain
      shell: bash
      run: rustup toolchain install && rustc --version

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Install cargo tools
      if: inputs.tools != ''
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
        CARGO_DENY_VERSION: 0.20.2
        CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        NEXTEST_VERSION: 0.9.150
        NEXTEST_SHA256: b0959bc64232974224cf9fb22c915845398c0e8668fa7831eb5b43fb1eef781f
        LLVM_COV_VERSION: 0.9.1
        LLVM_COV_SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
        SQLX_CLI_VERSION: 0.9.0
      run: |
        bin="$RUNNER_TEMP/bin"
        mkdir -p "$bin"
        echo "$bin" >> "$GITHUB_PATH"
        fetch() { # url sha256 -> verified file in $RUNNER_TEMP/dl.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/dl.tar.gz" "$1"
          echo "$2  $RUNNER_TEMP/dl.tar.gz" | sha256sum -c -
        }
        for tool in $TOOLS; do
          case $tool in
            deny)
              fetch "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" "$CARGO_DENY_SHA256"
              tar -xzf "$RUNNER_TEMP/dl.tar.gz" -C "$bin" --strip-components=1 "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" ;;
            nextest)
              fetch "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz" "$NEXTEST_SHA256"
              tar -xzf "$RUNNER_TEMP/dl.tar.gz" -C "$bin" cargo-nextest ;;
            llvm-cov)
              fetch "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz" "$LLVM_COV_SHA256"
              tar -xzf "$RUNNER_TEMP/dl.tar.gz" -C "$bin" cargo-llvm-cov ;;
            sqlx)
              # No release binaries; built once, then restored from the cache with ~/.cargo/bin.
              cargo install sqlx-cli --locked --version "$SQLX_CLI_VERSION" --no-default-features --features sqlite ;;
            *)
              echo "::error::unknown tool $tool"; exit 1 ;;
          esac
        done
