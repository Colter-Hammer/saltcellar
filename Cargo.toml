[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
db = { path = "crates/db" }
actual = { path = "crates/actual" }
api = { path = "crates/api" }

argon2 = "0.6.0"
axum = "0.8.9"
getrandom = "0.4.3"
http-body-util = "0.1"
ipnet = "2"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tempfile = "3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "6.0.0"

# The Rust rules in docs/standards.md. Every crate opts in with `[lints] workspace = true`.
# Warnings are denied by `-D warnings` on the clippy run; clippy.toml lets tests unwrap, panic and print.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
