# cargo-deny (docs/standards.md): advisories, licences, bans and duplicates, sources.

[graph]
# Only the platforms the app is built for, so Windows- and macOS-only crates don't count.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
]
all-features = true

[advisories]
# Every RustSec advisory fails, unmaintained and unsound included. Ignoring one needs an entry with a reason.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences compatible with AGPL-3.0, only those in use (an unused one warns).
# Adding one is a reviewed change: BSD-2-Clause and MPL-2.0 would also be fine. ISC came with
# `ring` and `rustls-webpki`, which TLS to the SimpleFIN Bridge needs (the `simplefin` crate's ureq);
# CDLA-Permissive-2.0 is `webpki-roots`' licence for Mozilla's list of root certificates, built in
# so the app doesn't depend on the host's certificate store.
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# The workspace's own crates are AGPL-3.0-only and never published.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# Each skip names the crates still on the older version; drop it when they move.
skip = [
  { crate = "base64@0.22", reason = "sqlx-core is on 0.22; ureq and the simplefin crate are on 0.23" },
  { crate = "getrandom@0.2", reason = "ring (under rustls, under ureq) is on 0.2; everything else is on 0.4" },
  { crate = "hashbrown@0.16", reason = "sqlx-core and hashlink are on 0.16; indexmap is on 0.17" },
  { crate = "syn@2", reason = "sqlx-macros and tracing-attributes are on syn 2; the rest are on 3" },
]
skip-tree = [
  { crate = "sha2@0.10", reason = "sqlx-core is on sha2 0.10 and its digest 0.10 tree; argon2 and the api crate are on 0.11" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
